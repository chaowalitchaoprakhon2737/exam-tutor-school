<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ครู | Exam Tutor</title><link rel="stylesheet" href="style.css"></head><body><header><a href="index.html" class="logo">Exam Tutor</a><span class="role teacher-role">ครู</span></header><main class="teacher-main"><section id="loginView" class="card login-card"><span class="eyebrow">TEACHER</span><h1>เข้าสู่ระบบครู</h1><form id="loginForm"><label>อีเมล<input id="email" type="email" required></label><label>รหัสผ่าน<input id="password" type="password" required></label><button class="primary wide">เข้าสู่ระบบ</button></form><div id="loginMsg" class="message"></div></section><section id="appView" hidden><div class="dashboard-head"><div><span class="eyebrow">TEACHER DASHBOARD</span><h1>ชุดติวข้อสอบ</h1></div><button id="logout">ออกจากระบบ</button></div><div class="tabs"><button class="tab active" data-tab="control">ควบคุมการติว</button><button class="tab" data-tab="builder">สร้างข้อสอบ</button><button class="tab" data-tab="results">ผลนักเรียน</button></div><section id="control" class="card panel"><div id="controlBox"></div></section><section id="builder" class="card panel" hidden><div class="form-grid"><label>ชื่อชุดข้อสอบ<input id="title" value="ชุดติวข้อสอบ"></label><label>เวลาต่อรอบ (นาที)<input id="duration" type="number" min="1" max="300" value="30"></label></div><div class="section-head"><div><h2>คำถามและเฉลย</h2><p class="muted">สร้างครั้งเดียว แล้วนำไปเริ่มรอบติวใหม่ได้หลายครั้ง</p></div><button id="addQuestion">+ เพิ่มข้อ</button></div><div id="questionEditor"></div><button id="saveExam" class="primary wide">บันทึกชุดข้อสอบ</button></section><section id="results" class="card panel" hidden><div class="section-head"><div><h2>ผลนักเรียน</h2><p id="summary" class="muted"></p></div><div class="actions"><button id="refreshResults">รีเฟรช</button><button id="clearAll" class="danger-btn">เคลียร์คะแนนทั้งหมด</button></div></div><div class="tableWrap"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>คะแนน</th><th>สถานะ</th><th>คำตอบ</th><th>จัดการ</th></tr></thead><tbody id="resultRows"></tbody></table></div></section><div id="teacherMsg" class="message"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="teacher.js"></script></body></html>
