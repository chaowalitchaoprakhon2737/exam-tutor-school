<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ครู | Exam Tutor</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="/teacher.html">Exam Tutor</a><span class="role teacher-role">สำหรับครู</span></header><main class="teacher-main"><section id="teacherLogin" class="card login-card"><span class="eyebrow">TEACHER PORTAL</span><h1>เข้าสู่ระบบครู</h1><p class="muted">หน้านี้แยกจากนักเรียนและต้องใช้รหัสครู</p><form id="teacherLoginForm"><label>รหัสครู<input id="pin" type="password" required autocomplete="current-password" placeholder="Teacher PIN"></label><button class="primary wide">เข้าสู่ระบบ</button></form><div id="loginMsg" class="message" aria-live="polite"></div></section><section id="teacherApp" hidden><div class="dashboard-head"><div><span class="eyebrow">TEACHER DASHBOARD</span><h1>จัดการข้อสอบ</h1></div><button id="logout">ออกจากระบบ</button></div><div class="tabs"><button class="tab active" data-tab="builder">สร้างข้อสอบ</button><button class="tab" data-tab="results">ผลนักเรียน</button></div><section id="builder" class="card panel"><div class="form-grid"><label>ชื่อชุดข้อสอบ<input id="title" value="ชุดติวข้อสอบ"></label><label>เวลาทำข้อสอบ (นาที)<input id="duration" type="number" min="1" max="300" value="15"></label></div><div class="section-head"><div><h2>รายการคำถาม</h2><p class="muted">แต่ละข้อต้องมีอย่างน้อย 2 ตัวเลือก</p></div><button id="addQuestion">+ เพิ่มข้อ</button></div><div id="questionEditor"></div><button id="saveExam" class="primary wide">บันทึกและเปิดข้อสอบ</button><div id="teacherMsg" class="message" aria-live="polite"></div></section><section id="results" class="card panel" hidden><div class="section-head"><div><h2>ผลการทำข้อสอบ</h2><p id="resultSummary" class="muted"></p></div><button id="refreshResults">รีเฟรช</button></div><div class="tableWrap"><table><thead><tr><th>เลขประจำตัว</th><th>ชื่อ</th><th>คะแนน</th><th>สถานะ</th><th>คำตอบรายข้อ</th></tr></thead><tbody id="resultRows"></tbody></table></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="teacher.js"></script></body></html>
