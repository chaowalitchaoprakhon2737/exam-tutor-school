<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นักเรียน | Exam Tutor</title><link rel="stylesheet" href="style.css"></head><body class="student-page"><header class="site-header compact"><a class="site-brand" href="index.html"><span class="brand-book">▤</span><span><b>Exam Tutor</b><small>Student</small></span></a><a class="back-link" href="index.html">← กลับหน้าแรก</a></header><main class="student-main"><section class="card student-card"><div id="joinView" class="student-join"><div class="login-symbol">🎓</div><span class="eyebrow">STUDENT</span><h1>เข้าสู่ระบบนักเรียน</h1><p class="muted">กรอกข้อมูลให้ครบถ้วน เพื่อเริ่มทำข้อสอบ</p><div id="sessionInfo" class="exam-info">กำลังตรวจสอบรอบการติว...</div><form id="joinForm"><label>เลขประจำตัวนักเรียน<input id="studentId" maxlength="50" required placeholder="เช่น 65001234"></label><label>ชื่อ - นามสกุล<input id="studentName" maxlength="120" required placeholder="เช่น สมชาย ใจดี"></label><button class="primary wide">เริ่มทำข้อสอบ →</button></form><div class="form-note">กรุณาตรวจสอบข้อมูลก่อนเริ่มทำข้อสอบ<br>เมื่อเริ่มแล้วไม่สามารถเปลี่ยนแปลงได้</div></div><div id="playView" hidden><div class="quiz-head"><div class="quiz-progress"><span id="progress" class="eyebrow">รอเริ่ม</span><div class="progress-track"><div id="progressBar"></div></div></div><span id="connection" class="live">● LIVE</span></div><div id="stage" aria-live="polite"></div></div><div id="msg" class="message" aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="student.js"></script></body></html>
