<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นักเรียน | Exam Tutor</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="/student.html">Exam Tutor</a><span class="role">สำหรับนักเรียน</span></header><main><section class="card student-card"><div id="login"><span class="eyebrow">STUDENT PORTAL</span><h1>เข้าสู่การทำข้อสอบ</h1><div id="examInfo" class="exam-info">กำลังตรวจสอบชุดข้อสอบ...</div><form id="startForm"><label>เลขประจำตัวนักเรียน<input id="studentId" required maxlength="30" autocomplete="username" placeholder="เช่น 65001234"></label><label>ชื่อและนามสกุล<input id="studentName" required maxlength="100" autocomplete="name" placeholder="เช่น สมชาย ใจดี"></label><div class="notice">เมื่อกดเริ่ม ระบบจะจับเวลาทันที และคำตอบที่เลือกแล้วจะไม่สามารถกลับมาแก้ไขได้</div><button class="primary wide">เริ่มทำข้อสอบ</button></form></div><div id="quiz" hidden><div class="quiz-head"><div><span id="progress" class="eyebrow"></span><div class="progress-track"><div id="progressBar"></div></div></div><strong id="timer" class="timer"></strong></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="nextBtn" class="primary wide" hidden>ข้อต่อไป</button></div><div id="studentMsg" class="message" aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="student.js"></script></body></html>
